name: llm-omics-platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev,api,chemistry,omics]'
      - run: python -m ruff check praxis2 praxis_virtualcell tests
      - run: praxis-vc --help
      - run: >-
          python -m pytest -q tests/agent_runtime tests/omics tests/llm_prediction tests/datasets tests/knowledge
          tests/test_llm_platform.py tests/test_llm_platform_agents.py tests/test_llm_platform_ui.py
          tests/mdr_gnb/unit/test_abstain.py
          tests/mdr_gnb/unit/test_features.py
          tests/mdr_gnb/unit/test_ensembler.py
          tests/mdr_gnb/unit/test_critic.py
          tests/mdr_gnb/unit/test_rule_baseline.py
          tests/mdr_gnb/unit/test_species_registry.py
          tests/mdr_gnb/unit/test_report_builder.py
          tests/mdr_gnb/api/test_schemas.py
