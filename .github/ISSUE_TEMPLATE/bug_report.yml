name: Bug report
description: Report a reproducible defect without secrets or private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private paths, raw biological data, or model weights."
  - type: input
    id: identity
    attributes:
      label: Version and Git SHA
      placeholder: "praxis-vc 1.7.0; 40-character SHA"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include redacted inputs, command, observed result, and expected result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Python/Node versions, and relevant optional extras.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private paths, raw private data, and model weights.
          required: true
        - label: I am not treating a contract or synthetic fixture as scientific evidence.
          required: true
