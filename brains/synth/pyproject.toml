[project]
name = "praxis-synth"
version = "0.1.0"
description = "PRAXIS-Synth: case-based-learning agent for synthetic biology (FBA / pathway / plasmid / circuit / cell-free / biosensor / strain / BGC)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "biopython>=1.83",
    "rdkit>=2024.3.1",
    "rank-bm25>=0.2.2",
    "watchdog>=3.0",
    "anthropic>=0.40",
    "sqlite-utils>=3.35",
    "rapidfuzz>=3.6",
    "cobra>=0.29",
    "dnachisel>=3.2",
    "pandas>=2.0",
    "sympy>=1.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "ipython",
]
fba_extras = [
    "cameo>=0.13",
    "memote>=0.17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
markers = [
    "slow: long-running test (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "scripts*", "lims*", "skills*"]
