name: synth_heterologous_pathway_design
description: |
  Heterologous pathway expression design (e.g., metabolite from KEGG).
  KEGG fetch → pathway design → FBA simulation → host optimization →
  codon-opt → Golden Gate assembly.
domain: synth
expected_outputs:
  - target_pathway
  - fba_flux
  - knockout_targets
  - codon_optimized_seqs
  - assembly_plan

steps:
  - skill: environment-setup
    label: "0. Synth env + binaries check"
    on_fail: abort

  - skill: kegg-fetcher
    label: "1. KEGG pathway / compound fetch (REST API only — anti-scraping)"
    on_fail: abort
    produces: [target_pathway, reaction_set]

  - skill: heterologous-pathway-design
    label: "2. Heterologous pathway design (gap-fill + enzyme selection)"
    on_fail: abort
    produces: [pathway_plan]

  - skill: fba-simulate
    label: "3. Flux balance analysis (cobrapy + model-specific media)"
    on_fail: abort
    produces: [fba_flux]

  - skill: optknock-strain
    label: "4. OptKnock host strain optimization"
    when: has:host_optimization_required
    on_fail: continue
    produces: [knockout_targets]

  - skill: codon-optimize
    label: "5. Codon optimization for host"
    on_fail: abort
    produces: [codon_optimized_seqs]

  - skill: golden-gate-assembly
    label: "6. Golden Gate assembly plan (BsaI / BsmBI overhang design)"
    on_fail: abort
    produces: [assembly_plan]
