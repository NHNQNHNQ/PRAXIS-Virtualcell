name: synth_bgc_mining_natural_product
description: |
  Biosynthetic gene cluster (BGC) mining → heterologous expression. NCBI
  taxon fetch + antiSMASH-style BGC discovery + heterologous pathway design
  with FBA validation + Golden Gate assembly plan.
domain: synth
expected_outputs:
  - bgc_predictions
  - heterologous_pathway
  - fba_flux
  - assembly_plan

steps:
  - skill: environment-setup
    label: "0. Synth env + antiSMASH / prodigal / hmmsearch binaries check"
    on_fail: abort

  - skill: ncbi-taxon-fetcher
    label: "1. NCBI taxon fetch (E-utils API only — anti-scraping)"
    on_fail: abort
    produces: [source_genomes]

  - skill: bgc-mining
    label: "2. BGC mining (antiSMASH + DeepBGC consensus)"
    on_fail: abort
    produces: [bgc_predictions]

  - skill: heterologous-pathway-design
    label: "3. Heterologous pathway design (gap-fill + enzyme selection per BGC)"
    on_fail: abort
    produces: [heterologous_pathway]

  - skill: fba-simulate
    label: "4. Flux balance analysis (host strain + minimal media + cofactors)"
    on_fail: abort
    produces: [fba_flux]

  - skill: codon-optimize
    label: "5. Codon optimization for production host"
    on_fail: abort
    produces: [codon_optimized_seqs]

  - skill: golden-gate-assembly
    label: "6. Golden Gate assembly plan"
    on_fail: abort
    produces: [assembly_plan]
