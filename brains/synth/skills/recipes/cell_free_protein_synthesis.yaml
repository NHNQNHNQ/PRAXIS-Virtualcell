name: synth_cell_free_protein_synthesis
description: |
  Cell-free TX-TL protein expression pipeline. Linear DNA / plasmid →
  codon-optimized → ribosome footprint check → constraint solve → cell-free
  test plan. PURE / E. coli S30 extract compatible.
domain: synth
expected_outputs:
  - codon_optimized_seqs
  - dna_construct
  - cellfree_test_plan
  - expected_yield_curve

steps:
  - skill: environment-setup
    label: "0. Synth env + RNAfold / NUPACK binaries check"
    on_fail: abort

  - skill: codon-optimize
    label: "1. Codon optimization for cell-free host (E. coli / PURE Δ ribosome)"
    on_fail: abort
    produces: [codon_optimized_seqs]

  - skill: dna-constraint-solve
    label: "2. DNA constraint solve (RBS strength + 5'UTR + restriction-site purge)"
    on_fail: abort
    produces: [dna_construct]

  - skill: cellfree-design
    label: "3. Cell-free TX-TL test plan (energy mix + Mg2+/K+ titration + amino acids)"
    on_fail: abort
    produces: [cellfree_test_plan, expected_yield_curve]

  - skill: circuit-simulate
    label: "4. (optional) ODE simulation if regulated by a sensor / circuit"
    when: has:circuit_required
    on_fail: continue
    produces: [simulation_traces]
