# PRAXIS-Synth retrieval configuration
#
# 8 channels, RRF fusion (k=60). Channel weights vary by stage so different
# stages emphasize different signals:
#   scoping     — strong prior on (synth_task, host_organism), then target/pathway
#   design      — method_choice + assembly_strategy dominate (picking tools)
#   execution   — almost only method_choice (skill scheduling)
#   reporting   — balanced; text channel slightly upweighted to learn from failure modes
#
# Pool routing: replace EnzymeAgent's CAZy family routing with (task, host).
# Pool sizes total to ~9 picks; cap at top_k inside agents.retrieval.

stage_weights:
  scoping:
    synth_task: 1.5
    host_organism: 1.2
    target_compound: 1.0
    pathway_class: 0.8
    assembly_strategy: 0.6
    scale: 0.5
    method_choice: 0.5
    text: 0.5
  design:
    synth_task: 1.0
    host_organism: 1.0
    target_compound: 0.7
    pathway_class: 0.7
    assembly_strategy: 1.2
    scale: 0.8
    method_choice: 1.5
    text: 0.4
  execution:
    synth_task: 0.5
    host_organism: 0.4
    method_choice: 1.0
    assembly_strategy: 0.6
    text: 0.3
  reporting:
    synth_task: 0.8
    host_organism: 0.7
    target_compound: 0.5
    pathway_class: 0.5
    method_choice: 0.5
    text: 0.6

pool_sizes:
  same_task_same_host: 5
  same_task: 2
  same_host: 1
  cross: 1

cold_start:
  thresholds:
    skip_retrieval_below: 5    # n=10 currently — never triggers
    same_task_only_below: 30   # below this, do not pull cross-task cases
    full_routing_at: 30

rrf:
  k: 60
