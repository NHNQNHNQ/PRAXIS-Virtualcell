# 智能体手册文案(从 PRAXIS V1 catalog 迁移)。
# helps_with=什么时候找它(场景痛点) · delivers=能给你什么(交付物) · examples=试试这样问。
helps_with:
  - "你刚拍完一批显微镜照片, 不知道怎么自动数细胞 / 量荧光强度"
  - "HCS 高内涵筛选有几千张图, 想批量做分割 + 形态分析"
  - "做空间转录组 (Visium) 想把组织切片图像和基因表达对齐"
delivers:
  - "Cellpose / StarDist 分割掩膜 + 计数表格"
  - "细胞形态聚类图 + ROI 标注 (CellProfiler / QuPath pipeline)"
  - "HCS 多孔板批处理脚本 (per-well 统计)"
  - "空间转录组图像-表达谱配准脚本"
examples:
  - "100 张 HeLa DAPI 数核 + 形态聚类"
  - "Cellpose vs StarDist 怎么选？"
