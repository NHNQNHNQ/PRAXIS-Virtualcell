[project]
name = "praxis-virtualcell"
version = "0.0.0"
description = "PRAXIS-2-derived multi-agent framework for virtual-cell prediction"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.26,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.23,<2",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
    "asyncpg>=0.29,<1",
    "redis>=5.0,<8",
    "argon2-cffi>=23,<26",
    "alembic>=1.13,<2",
    "fakeredis>=2.20,<3",
    "asyncssh>=2.14,<3",
]
# D.5 reviewer M0/M8 #4:prod 依赖必须 pin 上下界
# 下界基于 .venv 实测、上界取下个 major 防破坏性更新(三周后 rebuild 不爆)
prod = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "asyncpg>=0.29,<1",
    "redis>=5.0,<8",
    "gunicorn>=22.0,<27",
    "uvicorn[standard]>=0.30,<1",
    "argon2-cffi>=23,<26",
    "alembic>=1.13,<2",
]

# v0.4 W2:机制模型(GEM/FBA)——bacteria/yeast growth case;test 无 cobra 时 skip
mechanistic = [
    "cobra>=0.29,<1",
]
# v0.6:本地 API 服务(FastAPI)+ 本地网页(Streamlit)
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]
web = [
    "streamlit>=1.30,<2",
    "requests>=2.31,<3",
]

[project.scripts]
praxis-vc = "praxis_virtualcell.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["praxis2*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["._*", ".venv", "*.egg-info", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = ["integration: needs docker PG/Redis (skipped if unavailable)"]
addopts = "-q"
