[project]
name = "praxis-virtualcell"
version = "1.7.0"
description = "Contract-governed, abstaining foundation platform for programmable virtual cells"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.26,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.23,<2",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
    "asyncpg>=0.29,<1",
    "redis>=5.0,<8",
    "fakeredis>=2.20,<3",
    "greenlet>=3.1,<4",
    "watchdog>=2.1.5,<7",
    "packaging>=24,<27",
]

mechanistic = [
    "cobra>=0.29,<1",
]
omics = [
    "anndata>=0.12.10,<0.13",
    "mudata>=0.3.10,<0.4",
]
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]
web = [
    "streamlit>=1.30,<2",
    "requests>=2.31,<3",
]

[project.scripts]
praxis-vc = "praxis_virtualcell.cli:main"

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
praxis_virtualcell = ["**/*.yaml", "**/*.json", "**/*.txt", "**/*.md", "**/*.gz", "**/*.h5ad"]
praxis_vc_api = ["static/**/*"]

[tool.setuptools.exclude-package-data]
praxis_virtualcell = ["tests/*", "tests/**/*"]

[tool.setuptools.packages.find]
include = ["praxis2*", "praxis_virtualcell*", "praxis_vc_api*", "praxis_vc_web*"]
exclude = ["praxis_virtualcell.tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["._*", ".venv", "*.egg-info", "frontend", "docs", "scripts", "brains"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: needs explicitly enabled service, container, or release dependencies",
    "llm: makes a real external LLM request and requires explicit opt-in plus credentials",
    "remote: needs an explicitly enabled remote GPU, checkpoint, donor, or private service",
    "operational: probes a live deployed service rather than an isolated test dependency",
]
strict_markers = true
addopts = "-q"
