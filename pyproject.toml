[project]
name = "praxis-virtualcell"
version = "2.1.0"
description = "Strain-conditioned antibacterial assessment with LLM inference and traceable omics evidence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1", "mcp>=1.26,<2", "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3", "python-multipart>=0.0.9,<1",
    "python-magic>=0.4.27,<1", "PyYAML>=6.0,<7",
    "numpy>=2.4,<3", "joblib>=1.5,<2", "scikit-learn==1.9.0",
    "pandas>=2.3,<3", "pyarrow>=24,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10", "pytest-asyncio>=0.23,<2", "respx>=0.21,<1",
    "ruff>=0.5,<1", "fakeredis>=2.20,<3", "httpx2==2.7.0",
]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "sqlalchemy>=2,<3", "redis>=5,<8"]
chemistry = ["rdkit==2026.3.3"]
omics = ["anndata>=0.11,<0.13", "mudata>=0.3,<0.4", "h5py>=3.11,<4"]
mechanistic = ["cobra==0.31.1", "optlang==1.9.1", "swiglpk==5.0.13"]
server = [
    "asyncpg>=0.29,<1", "redis>=5,<8", "argon2-cffi>=23,<26",
    "alembic>=1.13,<2", "asyncssh>=2.14,<3", "gunicorn>=22,<27",
    "uvicorn>=0.27,<1", "fastapi>=0.110,<1",
]

[project.scripts]
praxis-vc = "praxis_virtualcell.cli:main"
praxis-mdr = "praxis_virtualcell.mdr_gnb.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["praxis2*", "praxis_virtualcell", "praxis_virtualcell.*"]
exclude = ["*.tests", "*.tests.*", "*.tests_real", "*.tests_real.*"]

[tool.setuptools.package-data]
praxis_virtualcell = ["**/*.yaml", "**/*.json", "**/*.md", "web/static/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["._*", ".venv", "data", "models", "local", "research", "reports"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: explicitly enabled external service or executable",
    "llm: explicitly enabled real LLM request",
    "remote: explicitly enabled remote compute or data",
    "operational: live deployment probe",
]
