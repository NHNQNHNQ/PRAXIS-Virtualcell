# SLURM 单节点配置 (zkyd / 10.102.106.53)
# 144 CPU / 528 GB RAM / 8 × A100-40GB
# 用法: sudo cp slurm.conf /etc/slurm/slurm.conf && sudo systemctl restart slurmctld slurmd

ClusterName=praxis
SlurmctldHost=zkyd

SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid

AuthType=auth/munge
CryptoType=crypto/munge

# 不要 cgroup, 单节点测试足矣
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

MpiDefault=none
SwitchType=switch/none
ReturnToService=2

# GPU
GresTypes=gpu

# 日志
SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# 计费 (本地,无 slurmdbd)
JobAcctGatherType=jobacct_gather/linux
AccountingStorageType=accounting_storage/none

# 节点 + 分区
NodeName=zkyd CPUs=144 RealMemory=515000 Gres=gpu:8 State=UNKNOWN
PartitionName=gpu Nodes=zkyd Default=YES MaxTime=INFINITE State=UP
