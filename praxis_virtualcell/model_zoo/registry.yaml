# Declarative model registry. Missing dependencies or assets cause fail-closed execution; asset hashes identify the recorded versions.
#   name / type(public_model|self_trained) / species(list) / module(∈ MODULE_ORDER) /
models:
  ecoli_gem:
    schema_version: vc.model-card.v1
    name: ecoli_gem
    type: public_model
    species: [bacteria]
    taxon: ["NCBITaxon:562"]
    module: cytoplasmic_metabolism
    modality: [{name: GEM, ontology_id: "PRAXISMODALITY:FBA"}]
    assay: ["PRAXISASSAY:FBA"]
    cell_domain:
      cell_type_ids: ["PRAXISCELL:ecoli_k12"]
      cell_type_names: ["E. coli K-12"]
      tissue_ids: []
      tissue_names: []
      allow_unspecified: false
    perturbation: [gene]
    task: growth
    output: [growth]
    feature_namespace: [{name: NCBIGene, version: "GCF_000005845.2", id_format: ncbi_gene_curie}]
    representation: ["constraint:FBA"]
    source: cobra_bundled_textbook
    license: cobrapy-bundled
    status: available
    wrapper: praxis_virtualcell.model_zoo.wrappers.gem_wrapper.GemWrapper
    version: e_coli_core-textbook
    requires: [cobra]
    assets: []
    resources: {python_dependencies: [cobra], required: [cpu]}
    uncertainty: {required: true, methods: [deterministic_fba], calibrated: false}
    ood:
      action: abstain
      dimensions: [taxon, modality, assay, cell_domain, perturbation, task, output, feature_namespace, representation]
    reliability_policy: gem_growth_disposition
    provenance: {distributable: true, model_family: constraint_based}

