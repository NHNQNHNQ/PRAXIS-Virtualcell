    wrapper: praxis_virtualcell.model_zoo.wrappers.self_trained_wrapper.SelfTrainedWrapper  # 未来
    version: v0-planned
    requires: [torch]
    assets: []
    resources: {python_dependencies: [torch], required: [cpu]}
    uncertainty: {required: true, methods: [point_estimate], calibrated: false}
    ood:
      action: abstain
      dimensions: [taxon, modality, assay, cell_domain, perturbation, task, output, feature_namespace, representation]
    reliability_policy: ml_disagreement
    training_card:                           # self_trained 必填(Task 2.7 校验)
      training_data: SGD deletion library growth screens (planned)
      split: by-gene holdout (planned)
      baseline: mean-fitness predictor
      metrics: {pearson: null, note: "planned, not yet trained"}
      provenance: "planned; no weights yet — status=planned gates broker fail-closed"
    provenance:                                    # 顶层块,诚实标注无数据(与其他条目结构对齐)
      training_data: SGD deletion library growth screens (planned — NOT YET AVAILABLE)
      architecture: TBD (deletion-fitness predictor; needs SGD data)
