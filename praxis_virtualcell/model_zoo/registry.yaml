# 声明式模型注册表(model zoo)。每条模型字段:
#   name / type(public_model|self_trained) / species(list) / module(∈ MODULE_ORDER) /
#   task / source / license / status(available|planned|missing) / wrapper(类路径) /
#   version / requires(list,如 cobra/torch/gpu) / reliability_policy /
#   training_card(仅 self_trained 必填,见 Task 2.7)
# 铁律:module 必须 ∈ biological_modules.MODULE_ORDER;缺资产/缺依赖 → 由 broker fail-closed。
models:
  ecoli_gem:
    name: ecoli_gem
    type: public_model
    species: [bacteria]
    module: cytoplasmic_metabolism
    task: growth
    source: cobra_bundled_textbook          # cobra 自带 e_coli_core,无需下载
    license: cobrapy-bundled
    status: available
    wrapper: praxis_virtualcell.model_zoo.wrappers.gem_wrapper.GemWrapper
    version: e_coli_core-textbook
    requires: [cobra]
    reliability_policy: gem_growth_disposition

  gears:
    name: gears
    type: public_model
    species: [human]
    module: genetic_hub
    task: perturbation_response
    source: "remote:gears_ckpt"             # 远端权重,Phase 2 不真下载(Phase 6 接入)
    license: MIT
    status: planned
    wrapper: praxis_virtualcell.model_zoo.wrappers.gears_wrapper.GearsWrapper  # Phase 6 才实现
    version: norman_2019
    requires: [torch, gpu]
    reliability_policy: ml_disagreement
    assets:
      - filename: gears_model.pt          # GEARS 原生 save/load 产物(.53)
        sha256: null                       # 占位:真 sha 待 .53 上算过填(requires_manual_fetch)
        source_note: "fetch from zkyd@10.102.106.53 conda env virtualcell; GEARS native save_model"
    provenance:
      training_data: norman_2019
      architecture: GEARS GNN hidden=64 5epoch
      metrics: {pearson: 0.9834, pearson_de: 0.8392, mse: 0.0068, comparable_delta_pearson: null}
      not_comparable_to_donor_base: true   # ADR-W4c-1:与 donor base 指标/split 不同,不可同表
      remote_env: {host: "zkyd@10.102.106.53", conda_env: "virtualcell (torch 2.6)"}
      distributable: false

  yeast_deletion_fitness:
    name: yeast_deletion_fitness
    type: self_trained
    species: [yeast]
    module: genetic_hub
    task: deletion_fitness
    source: "self_trained:yeast_deletion_fitness"
    license: internal
    status: planned
    wrapper: praxis_virtualcell.model_zoo.wrappers.self_trained_wrapper.SelfTrainedWrapper  # 未来
    version: v0-planned
    requires: [torch]
    reliability_policy: ml_disagreement
    training_card:                           # self_trained 必填(Task 2.7 校验)
      training_data: SGD deletion library growth screens (planned)
      split: by-gene holdout (planned)
      baseline: mean-fitness predictor
      metrics: {pearson: null, note: "planned, not yet trained"}
      provenance: "planned; no weights yet — status=planned gates broker fail-closed"

  scgpt:
    name: scgpt
    type: public_model
    species: [human]
    module: genetic_hub
    task: predict_delta_expression
    source: "remote:scgpt_ckpt"           # 远端 196MB ckpt,requires_manual_fetch
    license: MIT
    status: planned                        # 缺 torch/ckpt → 仍 planned,broker fail-closed
    wrapper: praxis_virtualcell.model_zoo.wrappers.scgpt_wrapper.ScgptWrapper
    version: norman_2019-pretrained_backbone
    requires: [torch, gpu]
    reliability_policy: ml_disagreement
    assets:
      - filename: pretrained_backbone.pt   # ≈196MB scGPT backbone + head
        sha256: null                        # 占位:真 sha 待 .53 上算过填
        source_note: "fetch from /home/zkyd/data1/mzy/scgpt_ckpt/norman_2019/ (host .53, env vc-scgpt)"
      - filename: pretrained_backbone.json # 重建 kwargs(backbone_name=scgpt)
        sha256: null
        source_note: "same dir; class_name + kwargs for build_predictor_from_ckpt"
    provenance:
      training_data: donor norman_2019 (frozen scGPT + light head)
      architecture: frozen backbone 53.8M + head 2.47M (saturated)
      metrics: {delta_pearson: 0.4407, cosine: 0.9808, n: 7290}
      not_comparable_to_donor_base: false  # per-cell ΔPearson 同表 A 口径可比
      frozen_backbone_underperforms: true  # 诚实:低于 base,SOTA 需 fine-tune(backlog)
      remote_env: {host: "zkyd@10.102.106.53", conda_env: "vc-scgpt (torch 2.3)", ckpt: "scgpt_ckpt/norman_2019/pretrained_backbone.{pt,json}"}
      distributable: false
