# 声明式模型注册表(model zoo)。每条模型字段:
#   name / type(public_model|self_trained) / species(list) / module(∈ MODULE_ORDER) /
#   task / source / license / status(available|planned|missing) / wrapper(类路径) /
#   version / requires(list,如 cobra/torch/gpu) / reliability_policy /
#   training_card(仅 self_trained 必填,见 Task 2.7)
# 铁律:module 必须 ∈ biological_modules.MODULE_ORDER;缺资产/缺依赖 → 由 broker fail-closed。
models:
  ecoli_gem:
    schema_version: vc.model-card.v1
    name: ecoli_gem
    type: public_model
    species: [bacteria]
    taxon: ["NCBITaxon:562"]
    module: cytoplasmic_metabolism
    modality: [{name: GEM, ontology_id: "PRAXISMODALITY:FBA"}]
    assay: ["PRAXISASSAY:FBA"]
    cell_domain:
      cell_type_ids: ["PRAXISCELL:ecoli_k12"]
      cell_type_names: ["E. coli K-12"]
      tissue_ids: []
      tissue_names: []
      allow_unspecified: false
    perturbation: [gene]
    task: growth
    output: [growth]
    feature_namespace: [{name: NCBIGene, version: "GCF_000005845.2", id_format: ncbi_gene_curie}]
    representation: ["constraint:FBA"]
    source: cobra_bundled_textbook          # cobra 自带 e_coli_core,无需下载
    license: cobrapy-bundled
    status: available
    wrapper: praxis_virtualcell.model_zoo.wrappers.gem_wrapper.GemWrapper
    version: e_coli_core-textbook
    requires: [cobra]
    assets: []
    resources: {python_dependencies: [cobra], required: [cpu]}
    uncertainty: {required: true, methods: [deterministic_fba], calibrated: false}
    ood:
      action: abstain
      dimensions: [taxon, modality, assay, cell_domain, perturbation, task, output, feature_namespace, representation]
    reliability_policy: gem_growth_disposition
    provenance: {distributable: true, model_family: constraint_based}

  gears:
    schema_version: vc.model-card.v1
    name: gears
    type: public_model
    species: [human]
    taxon: ["NCBITaxon:9606"]
    module: genetic_hub
    modality: [{name: scRNA, ontology_id: "EFO:0008913"}]
    assay: ["EFO:0008913"]
    cell_domain:
      cell_type_ids: ["CVCL_0004"]
      cell_type_names: [K562]
      tissue_ids: []
      tissue_names: []
      allow_unspecified: false
    perturbation: [gene, gene_combination]
    task: perturbation_response
    output: [absolute_expression]
    feature_namespace: [{name: EnsemblGene, version: GRCh38, id_format: ensembl_gene}]
    representation: ["matrix:X"]
    source: "remote:gears_ckpt"             # 远端权重,Phase 2 不真下载(Phase 6 接入)
    license: MIT
    status: planned
    wrapper: praxis_virtualcell.model_zoo.wrappers.gears_wrapper.GearsWrapper  # Phase 6 才实现
    version: norman_2019
    requires: [torch, gpu]
    resources: {python_dependencies: [torch], required: [gpu]}
    uncertainty: {required: true, methods: [point_estimate], calibrated: false}
    ood:
      action: abstain
      dimensions: [taxon, modality, assay, cell_domain, perturbation, task, output, feature_namespace, representation]
    reliability_policy: ml_disagreement
    assets:
      - filename: model.pt                # GEARS 原生 save_model 产物(.53 gears_ckpt/norman_2019/)
        sha256: 5fd17e628d81cb7ec9e894ca2720c7fc599e604259b96dc96810ed45e1cf17ac  # 本次重训 5ep 落盘;GEARS 无固定 seed(provenance no_fixed_seed),此 sha 锁本 ckpt 版本
        media_type: application/x-pytorch
        source_note: "fetch from zkyd@10.102.106.53 conda env virtualcell; GEARS native save_model (dir norman_2019/)"
      - filename: config.pkl              # GEARS load_pretrained 配套(hidden=64/uncertainty=False)
        sha256: 7da56a36e43e6fe9ff0846ec56e690df9aefb9e41a8e679873ef0d8086fa88e9
        media_type: application/octet-stream
        source_note: "same dir; required alongside model.pt for GEARS.load_pretrained"
    provenance:
      training_data: norman_2019
      architecture: GEARS GNN hidden=64 5epoch
      metrics: {pearson: 0.9834, pearson_de: 0.8392, mse: 0.0068, comparable_delta_pearson: null}
      not_comparable_to_donor_base: true   # ADR-W4c-1:与 donor base 指标/split 不同,不可同表
      remote_env: {host: "zkyd@10.102.106.53", conda_env: "virtualcell (torch 2.6)"}
      distributable: false

