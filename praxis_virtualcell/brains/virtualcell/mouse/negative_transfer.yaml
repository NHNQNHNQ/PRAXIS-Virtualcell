# mouse 视角的迁移规则。与 generic/general_negative_transfer.yaml 对照:
#   human → bacteria/yeast = 硬 negative transfer(reject,§7.4)
#   human → mouse          = 允许迁移,但带 caution(§7.3),不进 negative_transfer 黑名单
# 故此处 negative_transfer 为空(显式声明 human→mouse 不属负迁移),
# 改用 allowed_transfer 记录"可迁但需 ortholog + 标 cross-species uncertainty"。
negative_transfer: []
allowed_transfer:
  - from_species: human
    to_species: [mouse]
    transfer_allowed: true
    caution: [ortholog_required, cross_species_uncertainty]
    requires: ortholog_mapping
    rule: human_to_mouse_allowed_with_ortholog_caution
    rationale: mouse_and_human_both_mammalian_scrna_homologous_gene_programs
