# Human-to-mouse transfer is allowed with ortholog cautions; human-to-microbial negative transfer is declared separately.
negative_transfer: []
allowed_transfer:
  - from_species: human
    to_species: [mouse]
    transfer_allowed: true
    caution: [ortholog_required, cross_species_uncertainty]
    requires: ortholog_mapping
    rule: human_to_mouse_allowed_with_ortholog_caution
    rationale: mouse_and_human_both_mammalian_scrna_homologous_gene_programs
