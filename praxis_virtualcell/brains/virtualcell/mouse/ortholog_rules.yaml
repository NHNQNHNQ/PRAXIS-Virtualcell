# Human-to-mouse transfer requires ortholog mapping and explicit cross-species uncertainty; unmapped targets remain cautionary.
ortholog:
  direction: mouse_to_human
  required_before_predict: true
  caution_flag: ortholog_required
  uncertainty_when_transferred: high
  default_when_unmapped: caution
  map:
    Trp53: TP53
    Myc: MYC
    Ahr: AHR
    Stat1: STAT1
    Gata1: GATA1
  map_upper:
    TRP53: TP53
    MYC: MYC
    AHR: AHR
    STAT1: STAT1
    GATA1: GATA1
applies_to_predictors: [MockCPA, MockGEARS, MockLinear]
rule: human_predictor_transfer_to_mouse_requires_ortholog
