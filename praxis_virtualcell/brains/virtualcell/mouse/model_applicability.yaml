# mouse 与 human 同为 mammalian scRNA:human predictor 可迁,但需 ortholog 投影。
# 故 mouse 进 supported_species → MockCPA/MockGEARS/MockLinear 在 mouse 下 applicable(非 reject),
# 同时挂 caution=ortholog_required + cross_species_uncertainty,供 trace/Reliability 读取。
# 路由判定字段(决定 applicable/reject):supported_species/supported_modalities/supported_tasks/reject_if。
# caution.<species>(LIST)+ cross_species.rule 由 ModelApplicabilityAgent 读取 → 写入
#     brain_context.routing → provenance.ortholog_cautions → report.caution_flags(§7.3 可审),
#     但不影响 applicable/reject(mouse 仍 applicable)。supported_perturbations 等为声明式,不参与路由。
MockCPA:
  supported_species: [human, mouse]
  supported_modalities: [scRNA]
  supported_tasks: [predict_delta_expression]
  supported_perturbations: [gene, drug]
  caution:
    mouse: [ortholog_required, cross_species_uncertainty]
  cross_species:
    transferred_from: human
    requires: ortholog_mapping
    uncertainty: elevated
    rule: human_predictor_transfer_to_mouse_requires_ortholog
MockGEARS:
  supported_species: [human, mouse]
  supported_modalities: [scRNA]
  supported_tasks: [predict_delta_expression]
  supported_perturbations: [gene, gene_combination]
  reject_if: [gene_not_in_graph_vocabulary]
  caution:
    mouse: [ortholog_required, cross_species_uncertainty, graph_vocabulary_is_human_ortholog]
  cross_species:
    transferred_from: human
    requires: ortholog_mapping
    uncertainty: elevated
    rule: human_predictor_transfer_to_mouse_requires_ortholog
MockLinear:
  supported_species: [human, mouse]
  supported_modalities: [scRNA]
  supported_tasks: [predict_delta_expression]
  supported_perturbations: [gene, drug]
  caution:
    mouse: [ortholog_required, cross_species_uncertainty]
  cross_species:
    transferred_from: human
    requires: ortholog_mapping
    uncertainty: elevated
    rule: human_predictor_transfer_to_mouse_requires_ortholog
