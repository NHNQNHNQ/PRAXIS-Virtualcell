# Module support is descriptive; authoritative applicability remains in model_applicability.yaml.
species: bacteria
modules:
  membrane_system:
    support: medium
    reason: inner/outer membrane, LPS, and cell-envelope rules; no lipidomics predictor
    tools: [cell_envelope_rules, transporter_annotation]
  genetic_hub:
    support: weak
    reason: nucleoid/replication knowledge; no regulon perturbation predictor; a trained regulon-aware model is still required
    self_training: bacteria_regulon_response
  mitochondrial_energy_metabolism:
    support: medium
    reason: mapped to respiratory chain/redox/proton motive force; GEM covers the respiratory chain
    display_alias: Energy metabolism / redox module
    models: [gem_fba]
  cytoplasmic_metabolism:
    support: strong
    reason: actual iML1515 GEM execution (carbon-source shifts/essential genes/antibiotic metabolic targets)
    models: [gem_fba]
  biosynthetic_network:
    support: weak
    reason: ribosome/chaperone/secretion-system rules; no predictor
    tools: [chaperone_secretion_gene_set]
  cytoskeletal_framework:
    support: weak
    reason: MreB/FtsZ/cell-shape rules; a trained cell shape/division predictor is still required
    self_training: bacteria_cell_shape
  stress_processor:
    support: weak
    reason: SOS/heat shock/stringent-response rules; a trained antibiotic stress classifier is still required
    self_training: bacteria_antibiotic_stress
  degradation_machinery:
    support: weak
    reason: ATP-dependent proteases/protein quality control; no predictor
    tools: [atp_protease_gene_set]
biological_mismatch:
  - query: bacteria_autophagy
    verdict: caution
    reason: prokaryotes lack eukaryotic autophagy; use protease/protein-quality-control concepts instead
  - query: mitochondria
    verdict: caution
    reason: prokaryotes lack mitochondria; map to the M3 energy/redox module (respiratory chain)
