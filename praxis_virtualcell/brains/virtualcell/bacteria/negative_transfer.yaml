# Auditable species-specific negative-transfer rules.
negative_transfer:
  - from_species: human
    to_species: [bacteria]
    rule: mammalian_scrna_predictor_not_applicable
    rejects_predictors: [MockCPA, MockGEARS, MockLinear]
    reason: bacteria lack mammalian cell types and eukaryotic scRNA transcriptome structure; mammalian scRNA perturbation models cannot transfer
