# bacteria 专属负迁移声明(与 generic/general_negative_transfer.yaml 同 schema)。
# generic 已声明 human -> [bacteria, yeast] 的 mammalian_scrna_predictor_not_applicable;
# 这里在 bacteria brain 内再显式落地一条,使"为何 mammalian predictor 迁到 bacteria 不可用"
# 在 species 级 brain 中自包含、可审计(GPT §7.5)。bacteria 不是 mammalian、无真核 scRNA 结构,
# 故 CPA / GEARS / Linear 三个 mammalian scRNA perturbation 模型一律不可迁。
negative_transfer:
  - from_species: human
    to_species: [bacteria]
    rule: mammalian_scrna_predictor_not_applicable
    rejects_predictors: [MockCPA, MockGEARS, MockLinear]
    reason: bacteria 无 mammalian cell type / 无真核 scRNA 转录组结构,mammalian scRNA perturbation 模型不可迁移
