# Declarative yeast deletion, overexpression, and genetic-interaction semantics; eps = W_ab - W_a * W_b.
supported_perturbations:
  - gene_deletion
  - gene_overexpression
  - genetic_interaction
supported_tasks:
  - predict_genetic_interaction
  - predict_deletion_fitness
genetic_interaction:
  scoring: epistasis
  classes: [synthetic_lethal, negative, neutral, positive, suppression]
  requires_pair: true
notes:
  - yeast phenotypic readouts primarily measure fitness/growth rather than mammalian scRNA delta_expression
  - yeast perturbations use deletion/overexpression rather than the mammalian drug/gene perturbation paradigm
  - gene/pathway structures differ from mammals; scRNA atlas vocabularies are not interchangeable
