# Module support is descriptive; authoritative applicability remains in model_applicability.yaml.
species: yeast
modules:
  membrane_system:
    support: medium
    reason: ER-Golgi trafficking/lipid-synthesis rules; no dedicated predictor
    tools: [lipid_pathway_rules, trafficking_knowledge]
  genetic_hub:
    support: weak
    reason: deletion-library knowledge exists but no offline scRNA predictor; a trained deletion-to-fitness model is still required
    self_training: yeast_deletion_to_fitness
  mitochondrial_energy_metabolism:
    support: medium
    reason: respiration-fermentation switch; GEM covers respiratory metabolism
    models: [gem_fba]
  cytoplasmic_metabolism:
    support: strong
    reason: actual iMM904 GEM execution (carbon/nitrogen-source shifts/amino-acid synthesis)
    models: [gem_fba]
  biosynthetic_network:
    support: weak
    reason: no protein-quality-control predictor; ER quality-control rules only
    tools: [ribosome_folding_gene_set]
  cytoskeletal_framework:
    support: weak
    reason: no bud-morphology predictor
    self_training: yeast_bud_morphology
  stress_processor:
    support: weak
    reason: stress-granule/P-body knowledge exists but no predictor; a trained stress-state classifier is still required
    self_training: yeast_stress_state
  degradation_machinery:
    support: weak
    reason: vacuole/autophagy rules; no predictor
    tools: [vacuole_autophagy_gene_set]
biological_mismatch:
  - query: tissue_spatial_niche
    verdict: reject
    reason: unicellular fungus; tissue/spatial-niche concepts do not apply
  - query: mammalian_cell_communication
    verdict: reject
    reason: mammalian intercellular-communication context does not apply
