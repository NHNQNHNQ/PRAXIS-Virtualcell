# yeast ORF / 标准基因名 (Saccharomyces cerevisiae)。
# 与 human/object_vocabulary.yaml 同 schema:顶层 genes: [...]。
# ModelApplicabilityAgent 仅在 reject_if 含 gene_not_in_graph_vocabulary 时用到 genes,
# 但即便如此,MockGEARS 对 yeast 已先因 species 不匹配被拒,故 vocab 在本期主要供
# 审计/未来 yeast predictor 使用,并标记 species brain 确实"理解" yeast 对象。
genes:
  - GAL4        # 半乳糖代谢转录激活子(经典 genetic interaction 研究对象)
  - GAL80       # GAL4 负调控子
  - HIS3        # 组氨酸生物合成(常用营养缺陷 marker)
  - LEU2        # 亮氨酸生物合成 marker
  - URA3        # 尿嘧啶生物合成 marker
  - CYC1        # 细胞色素 c
  - STE12       # 交配信号通路转录因子
  - SNF1        # AMPK 同源,碳源响应
