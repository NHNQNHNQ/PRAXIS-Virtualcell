# Auditable species-specific negative-transfer rules.
negative_transfer:
  - from_species: human
    to_species: [yeast]
    rule: mammalian_scrna_predictor_not_applicable
    affected_predictors: [MockCPA, MockGEARS, MockLinear]
    action: reject
  - from_species: mouse
    to_species: [yeast]
    rule: vertebrate_to_fungus_not_applicable
    affected_predictors: [MockCPA, MockGEARS, MockLinear]
    action: reject
