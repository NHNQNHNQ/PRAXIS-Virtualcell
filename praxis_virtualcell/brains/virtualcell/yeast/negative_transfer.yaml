# yeast 局部 negative_transfer 声明(与 generic/general_negative_transfer.yaml 同 schema,
# 但聚焦 -> yeast 的迁移规则)。generic 已声明 human -> [bacteria, yeast]
# mammalian_scrna_predictor_not_applicable;此处补充 yeast 视角的更细规则,作为 species
# brain 的可审计依据(rules_referenced 命中)。
negative_transfer:
  - from_species: human
    to_species: [yeast]
    rule: mammalian_scrna_predictor_not_applicable
    # human scRNA delta_expression 模型对 yeast fitness/genetic_interaction 任务不可迁
    affected_predictors: [MockCPA, MockGEARS, MockLinear]
    action: reject            # yeast = 重 reject(非 caution),mammalian scRNA 范式根本不匹配
  - from_species: mouse
    to_species: [yeast]
    rule: vertebrate_to_fungus_not_applicable
    affected_predictors: [MockCPA, MockGEARS, MockLinear]
    action: reject
# 对照说明:human -> mouse 是 ortholog caution(applicable + caution);
# human/mouse -> yeast 是跨界(脊椎动物 -> 真菌),范式不匹配 => reject => 全拒 => abstain。
