# human = 三个 Mock* predictor 的母 species(原生宿主,无 cross-species 投影)。
# 故 human 下三者均 applicable 且 NO caution —— 作为 §7.3 mouse ortholog caution 的基线对照。
#
# 路由判定字段(ModelApplicabilityAgent 只读这几个,务必保持结构):
#   supported_species / supported_modalities / supported_tasks / reject_if
# 扩展字段(supported_cell_types / caution / native_host)不进入 applicable 判定,
#   仅随 brain_context 进 trace,供 ReliabilityAgent / 人读(向后兼容,与 mouse 同约定)。
MockCPA:
  supported_species: [human]
  supported_modalities: [scRNA]
  supported_tasks: [predict_delta_expression]
  supported_perturbations: [gene, drug]
  supported_cell_types: [K562, A549, MCF7, HEK293T]
  native_host: human          # 原生宿主,无 ortholog 投影
  caution: {}                 # human 下无 caution(对照 mouse 的 ortholog_required)
MockGEARS:
  supported_species: [human]
  supported_modalities: [scRNA]
  supported_tasks: [predict_delta_expression]
  supported_perturbations: [gene, gene_combination]
  reject_if: [gene_not_in_graph_vocabulary]
  supported_cell_types: [K562, RPE1]
  native_host: human
  caution: {}
MockLinear:
  supported_species: [human]
  supported_modalities: [scRNA]
  supported_tasks: [predict_delta_expression]
  supported_perturbations: [gene, drug]
  supported_cell_types: [K562, A549, MCF7, HEK293T]
  native_host: human
  caution: {}
