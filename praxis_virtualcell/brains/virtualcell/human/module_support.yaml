# Module support is descriptive; authoritative applicability remains in model_applicability.yaml.
species: human
modules:
  membrane_system:
    support: weak
    reason: no dedicated membrane-system engine; indirect evidence from lipid-pathway rules/transporter annotations
    tools: [lipid_pathway_rules, transporter_annotation]
  genetic_hub:
    support: strong
    reason: native scRNA predictor (donor_predictor); Perturb-seq scope
    models: [donor_predictor]
  mitochondrial_energy_metabolism:
    support: medium
    reason: no mechanistic GEM integration; expression-level metabolic-pathway tendency scoring (pathway_scoring)
    models: [pathway_scoring]
  cytoplasmic_metabolism:
    support: medium
    reason: no mammalian mechanistic GEM; pathway_scoring tendency only
    models: [pathway_scoring]
  biosynthetic_network:
    support: weak
    reason: no protein-abundance/folding engine; AlphaFold/PLM integration remains prospective
    tools: [ribosome_upr_gene_set]
  cytoskeletal_framework:
    support: weak
    reason: spatial_niche supplies indirect evidence only; no morphology foundation model
    models: [spatial_niche]
  stress_processor:
    support: medium
    reason: state_scoring and drug signatures (LINCS) cover stress states
    models: [state_scoring, embedding]
  degradation_machinery:
    support: weak
    reason: no degradation-pathway engine; proteasome/autophagy gene-set rules only
    tools: [proteostasis_gene_set]
biological_mismatch: []
