# S. marcescens brain(五键)。固有:染色体 AmpC(SST-1)+ 固有 colistin 耐药。
intrinsic_resistance: true
rules:
  - id: intrinsic_colistin
    if: {species: "serratia_marcescens"}
    then: {colistin: R}
    provenance: "固有 colistin 耐药(脂多糖修饰);EUCAST intrinsic resistance table"
resistance_mechanisms:
  - name: ampc_sst1
    features: ["ampC_derepressed"]
    mechanism: beta_lactam_hydrolysis
    supervised_by: "beta_lactamase_activity"
negative_cases:
  - note: "固有 colistin 耐药,不得报告 colistin S(阴性对照)"
    drug: colistin
assay_boundaries:
  - method: broth_microdilution
    supported: true
    note: "固有耐药物种,折点解释须结合 intrinsic resistance 表"
species_specific_breakpoints:
  meropenem: {S: "<=2", R: ">8", source: "EUCAST v14.0"}
