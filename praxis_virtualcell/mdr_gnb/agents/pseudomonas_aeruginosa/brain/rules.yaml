# P. aeruginosa brain(五键)。OprD 缺失 + MexAB-OprM 外排 + VIM/IMP 金属酶。
rules:
  - id: oprd_loss_carbapenem
    if: {mutation: "oprD_disrupted"}
    then: {imipenem: R}
    provenance: "OprD 通道丢失(非 FBA;学习/规则状态模型)"
resistance_mechanisms:
  - name: porin_loss_oprd
    features: ["oprD_disrupted"]
    mechanism: reduced_outer_membrane_permeability
    supervised_by: "outer_membrane_permeability"
  - name: efflux_mexab
    features: ["mexAB_overexpression"]
    mechanism: rnd_efflux
    supervised_by: "efflux_activity"
negative_cases:
  - note: "OprD 缺失主要影响亚胺培南,不自动判美罗培南 R"
    drug: meropenem
assay_boundaries:
  - method: broth_microdilution
    supported: true
species_specific_breakpoints:
  meropenem: {S: "<=2", R: ">8", source: "EUCAST v14.0"}
  ceftazidime: {S: "<=8", R: ">8", source: "EUCAST v14.0"}
