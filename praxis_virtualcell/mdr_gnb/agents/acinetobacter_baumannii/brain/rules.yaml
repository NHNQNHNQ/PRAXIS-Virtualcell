# A. baumannii brain(五键)。碳青霉烯酶 OXA-23/24 + 外排 AdeABC。
rules:
  - id: oxa23_carbapenem
    if: {gene: "blaOXA-23"}
    then: {meropenem: R, imipenem: R}
    provenance: "AMRFinderPlus 3.12.8; CARD:ARO:3001426"
resistance_mechanisms:
  - name: carbapenemase_oxa
    genes: ["blaOXA-23", "blaOXA-24", "blaOXA-58"]
    mechanism: carbapenem_hydrolysis
    supervised_by: "beta_lactamase_activity"
  - name: efflux_adeabc
    features: ["adeABC_overexpression"]
    mechanism: rnd_efflux
    supervised_by: "efflux_activity"
negative_cases:
  - note: "无 OXA/金属酶时不得仅凭 adeABC 判碳青霉烯 R(需协同)"
    drug: meropenem
assay_boundaries:
  - method: broth_microdilution
    supported: true
species_specific_breakpoints:
  meropenem: {S: "<=2", R: ">8", source: "EUCAST v14.0"}
