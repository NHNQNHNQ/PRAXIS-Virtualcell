# E. cloacae brain(五键)。染色体 AmpC 去阻遏 + ESBL/碳青霉烯酶。
rules:
  - id: ampc_derepression_3gc
    if: {mutation: "ampC_derepressed"}
    then: {ceftriaxone: R, cefotaxime: R}
    provenance: "AmpC 高产(ampD/ampR);EUCAST v14.0"
resistance_mechanisms:
  - name: ampc_hyperproduction
    features: ["ampC_derepressed"]
    mechanism: beta_lactam_hydrolysis
    supervised_by: "beta_lactamase_activity"
negative_cases:
  - note: "AmpC 对头孢吡肟相对稳定,不自动判 cefepime R"
    drug: cefepime
assay_boundaries:
  - method: broth_microdilution
    supported: true
species_specific_breakpoints:
  ceftriaxone: {S: "<=1", R: ">2", source: "EUCAST v14.0"}
  meropenem: {S: "<=2", R: ">8", source: "EUCAST v14.0"}
