# Norman 2019 perturbation benchmark: source identity and observed split recipe.
dataset: norman_2019
description: >
  Norman et al. 2019 single-cell CRISPRa genetic interaction atlas (K562),
  processed by VCBench as h5ad with control, GENE+ctrl, and GENE_A+GENE_B conditions.
  The dataset is acquired separately and is not redistributed here.
source:
  paper: "Norman et al., Exploring genetic interaction manifolds constructed from rich single-cell phenotypes"
  venue: "Science 365(6455):786-793 (2019)"
  doi: "10.1126/science.aax4438"
processed_file:
  path: "data/raw/tasks_data/unseen_perts/norman2019_comb_stack.h5ad"
  donor_root: "<VC_DONOR_ROOT>"
  size_bytes: 937614888
  sha256: "e3d116b4e01baffb154b7b42b4ad9d2c6680b088c2d7aba766d4dd4d8b4317de"
  shape: "118856 x 2000 (cells x genes)"
loader_recipe:
  function: "bench.vcbench.loader.load_vcbench_split"
  test: { name: norman_2019, split: test, max_cells_per_pert: 200, rng_seed: 1 }
  train: { name: norman_2019, split: train, max_cells_per_pert: 200, rng_seed: 0 }
  metric: "per-cell delta Pearson (coordinator.eval_agent.EvalAgent, batch_size=64)"
# Split counts are observed overlap of the processed train/test perturbation sets.
splits:
  in_distribution_seen:
    definition: "Test perturbations present in the training perturbation set"
    n_perturbations: 69
    n_cells: 5818
  ood_perturbation_unseen:
    definition: "Test perturbations absent from the training perturbation set"
    n_perturbations: 82
    n_cells: 13056
    examples: ["BCORL1", "CBFA2T3", "CDKN1B", "CBL+PTPN12", "BPGM+ZBTB1"]
  totals: { test_perturbations: 151, test_cells: 18874, train_perturbations: 137 }
abstain_mechanism:
  type: "ensemble_disagreement (cross_base_agreement)"
  impl: "coordinator.eval_agent.EvalAgent(aux_bases=[...], tau_disagreement, abstain_granularity=pert_level)"
  reproduce: "python -m praxis_virtualcell.benchmarks.abstain_gain"
  honesty: >
    In the recorded risk-coverage experiment, rejecting high-disagreement perturbations
    increased delta Pearson on retained predictions. GPU floating-point variation near
    thresholds caused approximately +/-0.01 variation in abstention rate and gain between runs.
    Gain uses the fixed full-coverage reference at the largest threshold.
