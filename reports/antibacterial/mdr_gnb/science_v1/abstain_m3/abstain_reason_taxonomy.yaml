coverage_insufficient:
  命中组合数: 15
  示例:
  - acinetobacter_baumannii::aztreonam
  - acinetobacter_baumannii::meropenem
  - acinetobacter_baumannii::tobramycin
  - acinetobacter_baumannii::trimethoprim-sulfamethoxazole
  - escherichia_coli::amikacin
  说明: 要把 covered ME 压到 <0.1 需弃权 >30%(覆盖率 c<0.70),达不到 safety-pass 的高覆盖要求;多见于规则本身大量误判
    R(ME 高)的组合,abstain 无法在保覆盖前提下同时控 VME 与 ME。
low_confidence:
  命中组合数: 24
  示例:
  - acinetobacter_baumannii::ampicillin
  - acinetobacter_baumannii::aztreonam
  - acinetobacter_baumannii::meropenem
  - acinetobacter_baumannii::tobramycin
  - acinetobacter_baumannii::trimethoprim-sulfamethoxazole
  说明: '|prob_R − t*| 小:ML 对规则判 S 的样本无把握。弃权主力——所有 ML 弃权本质都是剔除离阈最近的低置信 rule=S 样本(rule=R
    样本 conf=∞ 恒保留)。safety-pass 正是靠它把危险漏判压到规则法之下。'
st_extrapolation:
  命中组合数: 6
  示例:
  - escherichia_coli::amikacin
  - escherichia_coli::chloramphenicol
  - escherichia_coli::levofloxacin
  - klebsiella_pneumoniae::chloramphenicol
  - pseudomonas_aeruginosa::amikacin
  说明: 弃权的危险漏判候选(真 R 弃权样本)中**多数**(占比≥50%)落在训练里 R-ST 稀少的 ST(全池该 ST 真 R 株数≤2)。此类 isolate
    的耐药机制在克隆群层面证据薄弱、ML 外推不可靠,弃权本质是规避 ST 级过拟合而非纯阈值邻近。
