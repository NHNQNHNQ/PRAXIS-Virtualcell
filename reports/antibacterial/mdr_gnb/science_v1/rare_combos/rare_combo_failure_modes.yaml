breakpoint_variability:
  说明: colistin 的 MIC 折点(breakpoint)历史上多次修订、各标准(CLSI/EUCAST)不一致,R/S 判定随标准漂移。训练标签本身承载折点不确定性。
  为何不宣称强预测: 标签金标准不稳,任何高 AUC 都可能只是拟合了特定标准的判定习惯,不宜外推。
phenotype_noise:
  说明: colistin 表型测定(肉汤微量稀释)技术难度高、重复性差,纸片扩散不可靠,实验室间一致性低 → 表型标签噪声大。
  为何不宣称强预测: 标签噪声抬高不可约误差下限,VME/ME 的绝对值不能当作真实临床错误率解读。
mcr_negative_mechanism:
  说明: colistin 耐药大量由 mcr 阴性机制驱动(mgrB/pmrAB/phoPQ 等染色体突变、脂多糖修饰),机制多样且部分不在现有 AMRFinder
    基因型特征覆盖内。
  为何不宣称强预测: 关键耐药机制未被特征表征 → 模型对 mcr 阴性耐药存在系统性盲区,召回天花板低。
no_rule_baseline:
  说明: 规则表(amrfinder_sir_rules.yaml)未收录 colistin,RuleBaselineSIR 对 colistin 抛 KeyError
    → 无规则基线可对照。
  为何不宣称强预测: 无对照就无从声称「优于规则」;本任务只做 ML-only 表征,不算 ΔVME、不做规则对照、不硬求 strong-pass。
